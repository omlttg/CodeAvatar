version: '3.8'

services:
  codeavatar-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codeavatar_isolated
    ports:
      - "${PORT:-8005}:8000"
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 16G
        reservations:
          cpus: '2.0'
          memory: 2G
